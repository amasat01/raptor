#
# CI for raptor. raptor has zero hard dependencies,
# so every job runs unmodified on a plain GitHub-hosted runner — no CUDA, no
# self-hosted anything.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}
  schedule:
    - cron: "23 4 * * 1"   # weekly on main: every remembered pass is run again

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the headline and fails on any difference.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: raptor
      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./raptor/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: raptor/.github/companions
      # companion site (amasat01.github.io): same rule
      - uses: ./raptor/.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: raptor/.github/companions
      - id: memo
        uses: ./raptor/.github/actions/memo
        with:
          name: ci-docs-fresh
          args: >-
            --tree raptor --skip CHANGELOG.md --skip .github/ --tree eagle --only tools/prose_claims.py --only benchmarks/_card_common.py --only benchmarks/perf_card/ --only benchmarks/device_names.json --only benchmarks/card_provenance.json --only benchmarks/cards_manifest.json --only benchmarks/sol_reference.json --tree site --skip tests/ --skip .github/ --tree raptor --only .github/actions/ --only .github/ci_digest.sh --only .github/companions --file raptor/.github/workflows/ci.yml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: raptor/ci/constraints.txt
        if: steps.memo.outputs.run == 'true'
      - name: documented numbers and the capability map match the committed cards
        working-directory: raptor
        run: make gate-fresh SITE_SRC=../site EAGLE_SRC=../eagle
        if: steps.memo.outputs.run == 'true'
      - name: manifesto copy, ruff (repo config), every public name has a test or an allowlist line
        working-directory: raptor
        run: make gate-lint gate-names
        if: steps.memo.outputs.run == 'true'
      - if: success() && steps.memo.outputs.run == 'true'
        uses: ./raptor/.github/actions/memo-save
        with:
          name: ci-docs-fresh
          digest: ${{ steps.memo.outputs.digest }}

  test-python:
    needs: docs-fresh
    # The test suite.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - id: memo
        uses: ./.github/actions/memo
        with:
          name: ci-test-python
          args: >-
            --tree . --skip CHANGELOG.md --skip .github/ --skip-ext .ipynb --tree . --only .github/actions/ --only .github/ci_digest.sh --only .github/cuda_redist.sh --only .github/companions --file .github/workflows/ci.yml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
        if: steps.memo.outputs.run == 'true'
      - run: make gate-test
        if: steps.memo.outputs.run == 'true'
      - if: success() && steps.memo.outputs.run == 'true'
        uses: ./.github/actions/memo-save
        with:
          name: ci-test-python
          digest: ${{ steps.memo.outputs.digest }}

  ft-stress:
    needs: docs-fresh
    # The free-threading rows (pytest marker `ft`), which skip on a GIL build:
    # run them on both free-threaded interpreters, with the GIL left off.
    runs-on: ubuntu-24.04
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v7
      - id: memo
        uses: ./.github/actions/memo
        with:
          name: ci-ft-stress
          args: >-
            --tree . --skip CHANGELOG.md --skip .github/ --skip-ext .ipynb --tree . --only .github/actions/ --only .github/ci_digest.sh --only .github/cuda_redist.sh --only .github/companions --file .github/workflows/ci.yml
          extra: ${{ toJSON(matrix) }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
        if: steps.memo.outputs.run == 'true'
      # free-threaded: newest NumPy/SciPy ship no wheel for the newest free-threaded builds: prefer a wheel over an sdist build
      - run: python -m pip install --quiet --prefer-binary -e . pytest pyyaml 'jsonschema>=4'
        if: steps.memo.outputs.run == 'true'
      - name: The interpreter runs without the GIL
        run: |
          test -z "${PYTHON_GIL:-}" || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert not sys._is_gil_enabled(), 'the GIL is on'"
        if: steps.memo.outputs.run == 'true'
      - name: Free-threading rows (never zero)
        run: |
          n=$(python -m pytest -m ft --collect-only -q | grep -c '::' || true)
          echo "ft rows collected: $n"
          test "$n" -gt 0
          python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m ft
        if: steps.memo.outputs.run == 'true'
      - run: python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m "not cross_repo"
        if: steps.memo.outputs.run == 'true'
      - if: success() && steps.memo.outputs.run == 'true'
        uses: ./.github/actions/memo-save
        with:
          name: ci-ft-stress
          digest: ${{ steps.memo.outputs.digest }}
