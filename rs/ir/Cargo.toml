[package]
name = "raptor_ir"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
rcore = { path = "../core" }

[features]
# a context that rewrites the node keys its digests take: only the replay tools of recordings made before a node gained a field
# enable it; the libraries are built without it
replay-key-form = []
