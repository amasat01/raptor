#
# CI for raptor. raptor has zero hard dependencies,
# so every job runs unmodified on a plain GitHub-hosted runner — no CUDA, no
# self-hosted anything.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    # The release label, the diff, the PR body and the tag it would create agree (tools/release_gate.sh). Skipped on other PRs.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash tools/release_gate.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the headline and fails on any difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: raptor
      # companion eagle: the ref pinned in .github/companions, else a same-named branch, else main
      - uses: ./raptor/.github/actions/companion
        with:
          repo: eagle
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: raptor/.github/companions
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # companion site (amasat01.github.io): same rule
      - uses: ./raptor/.github/actions/companion
        with:
          repo: amasat01.github.io
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
          pins: raptor/.github/companions
      - run: python -m pip install --quiet ./site
      - name: documented numbers and the capability map match the committed cards
        working-directory: raptor
        run: python -m raptor_docs.fresh --check --site ../site
      - name: manifesto copy
        working-directory: raptor
        run: MANIFESTO_SOURCE=docs/content/principles.md bash tools/manifesto_check.sh CONTRIBUTING.md
      - name: ruff, pyflakes rules (repo config)
        working-directory: raptor
        run: |
          python -m pip install --quiet --only-binary=:all: ruff==0.15.18
          ruff check
  test-python:
    needs: docs-fresh
    # The test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e . pytest pyyaml 'jsonschema>=4'
      - run: python -m pytest -q -rs -m "not cross_repo"

  ft-stress:
    needs: docs-fresh
    # The free-threading rows (pytest marker `ft`), which skip on a GIL build:
    # run them on both free-threaded interpreters, with the GIL left off.
    runs-on: ubuntu-latest
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      # free-threaded: newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
      - run: python -m pip install --quiet --prefer-binary -e . pytest pyyaml 'jsonschema>=4'
      - name: The interpreter runs without the GIL
        run: |
          test -z "${PYTHON_GIL:-}" || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert not sys._is_gil_enabled(), 'the GIL is on'"
      - name: Free-threading rows (never zero)
        run: |
          n=$(python -m pytest -m ft --collect-only -q | grep -c '::' || true)
          echo "ft rows collected: $n"
          test "$n" -gt 0
          python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m ft
      - run: python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m "not cross_repo"
