#
# CI for raptor. raptor has zero hard dependencies,
# so every job runs unmodified on a plain GitHub-hosted runner — no CUDA, no
# self-hosted anything.

name: CI

# Pull requests only: main receives the tested tree, nothing re-runs there.
on:
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-fresh:
    # Freshness check, never a commit: the generator re-renders the headline and fails on any difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: raptor
      # companion eagle: same-named branch if it exists there, else main
      - id: ref_eagle
        env:
          COMPANION_REPO: eagle
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN:-none}" | base64 -w0)"
          [ -n "${GH_TOKEN:-}" ] || auth="X-Unauthenticated: 1"
          found="$(git -c http.extraHeader="$auth" ls-remote --heads "https://github.com/amasat01/${COMPANION_REPO}" "refs/heads/${BRANCH_NAME}" | awk '{print $2}')"
          if [ "$found" = "refs/heads/${BRANCH_NAME}" ]; then ref="$BRANCH_NAME"; else ref=main; fi
          echo "companion ${COMPANION_REPO} @ ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: amasat01/eagle
          ref: ${{ steps.ref_eagle.outputs.ref }}
          path: eagle
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # companion site (amasat01.github.io): same-named branch if it exists there, else main
      - id: ref_site
        env:
          COMPANION_REPO: amasat01.github.io
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN:-none}" | base64 -w0)"
          [ -n "${GH_TOKEN:-}" ] || auth="X-Unauthenticated: 1"
          found="$(git -c http.extraHeader="$auth" ls-remote --heads "https://github.com/amasat01/${COMPANION_REPO}" "refs/heads/${BRANCH_NAME}" | awk '{print $2}')"
          if [ "$found" = "refs/heads/${BRANCH_NAME}" ]; then ref="$BRANCH_NAME"; else ref=main; fi
          echo "companion ${COMPANION_REPO} @ ${ref}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: amasat01/amasat01.github.io
          ref: ${{ steps.ref_site.outputs.ref }}
          path: site
          token: ${{ secrets.SIBLING_READ_TOKEN || github.token }}
      - name: documented numbers and family visuals match the committed cards
        run: bash raptor/tools/docs_fresh.sh eagle site
  test-python:
    needs: docs-fresh
    # The test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e . pytest pyyaml
      - run: python -m pytest -q -rs -m "not cross_repo"

  ft-stress:
    needs: docs-fresh
    # The free-threading rows (pytest marker `ft`), which skip on a GIL build:
    # run them on both free-threaded interpreters, with the GIL left off.
    runs-on: ubuntu-latest
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # free-threaded: newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
      - run: python -m pip install --quiet --prefer-binary -e . pytest pyyaml
      - name: The interpreter runs without the GIL
        run: |
          test -z "${PYTHON_GIL:-}" || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert not sys._is_gil_enabled(), 'the GIL is on'"
      - name: Free-threading rows (never zero)
        run: |
          n=$(python -m pytest -m ft --collect-only -q | grep -c '::' || true)
          echo "ft rows collected: $n"
          test "$n" -gt 0
          python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m ft
      - run: python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m "not cross_repo"
