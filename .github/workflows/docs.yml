#
# Build the Sphinx docs and deploy to GitHub Pages on push to main. Notebooks
# under docs/content/{tutorials,examples}/ are executed LOCALLY (`make
# nbexec`) and committed with their outputs; this job never re-executes them
# — `make nbcheck` only verifies every one already has output, and the build
# renders what is committed. raptor has zero hard dependencies, so this runs
# on a plain GitHub-hosted runner — no CUDA, no self-hosted anything.

name: Docs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --quiet -e .
          python -m pip install --quiet pytest \
            Sphinx==8.2.3 myst-nb==1.4.0 sphinx-book-theme==1.2.0 sphinx-design==0.7.0 \
            sphinx-copybutton==0.5.2 sphinx-autodoc-typehints==3.5.2
      - run: make -C docs nbcheck
      - run: make -C docs strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
