[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
# DIST name vs IMPORT name. The import name stays flat and unchanged
# (`import raptor`); only the DISTRIBUTION name carries the `raptor-` family
# namespace. `raptor` on PyPI is an unrelated py2 deploy tool
# (2.15.2 -> Fabric==1.4.0) and a bare `pip install raptor` resolves to it —
# measured. Renaming the import package was rejected: it would churn every
# test, doc and example for a collision that only exists on the index.
# The `raptor.pattern_loaders` entry-point GROUP (declared by a downstream
# package) is a namespace string keyed to the IMPORT name — it is NOT a dist
# name and must never gain the prefix.
name = "raptor-core"
dynamic = ["version"]
description = "raptor — the protocol spine of the family: schema, typing.Protocols, golden conformance suite"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alessandro Masat" }]
classifiers = [
    "Programming Language :: Python :: 3",
]
# raptor is the pure-contract package the whole family depends DOWN on — zero
# hard deps, by design. numpy is imported function-local only, so the
# package stays importable on a numpy-less interpreter.
dependencies = []

[project.optional-dependencies]
# what the tests import: the manifest schema and the yaml/jsonschema rows
test = ["pytest", "pyyaml", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/amasat01/raptor"
Documentation = "https://amasat01.github.io/raptor/"
Repository = "https://github.com/amasat01/raptor"

[tool.setuptools_scm]
# the version is the latest vX.Y.Z tag (a PR build tags its checkout first); sdists carry it in PKG-INFO

[tool.setuptools.packages.find]
include = ["raptor*"]

[tool.setuptools.package-data]
raptor = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `import raptor` work against the checked-out tree without an install —
# this repo root, prepended to sys.path before collection.
pythonpath = ["."]
markers = [
    "ft: free-threading rows (raptor.conformance.freethreading) -- skip on a GIL build; select with -m ft on 3.13t/3.14t. Never run them under -X gil=... or PYTHON_GIL (the gate fails if you do).",
    "cross_repo: eagle conformance battery (deselect explicitly via -m 'not cross_repo'; the only sanctioned way these tests do not run — sibling absence is a HARD FAIL, never a skip)",
    "repo_local: venv-gate guardrail — certifies the REPOSITORY (docs/pyproject/source-as-text, or a dev-env package-presence assumption), never the installed DISTRIBUTION, so a wheel legitimately cannot carry what it checks. Deselect only in the isolated-venv leg (-m 'not repo_local'); the repo-rooted suite (CI, dev runs) always runs these — never deselected there. The venv leg enumerates and pins the count by collection, never a hand list.",
]

[tool.ruff]
target-version = "py39"
# notebooks are executed by nbcheck, not linted
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["F"]
# kernel bodies assign named values the tracer reads; deleting them changes the kernel
ignore = ["F841"]

