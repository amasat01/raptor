#
# CI for raptor. raptor has zero hard dependencies,
# so both jobs run unmodified on a plain GitHub-hosted runner — no CUDA, no
# self-hosted anything.

name: CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-python:
    # The test suite.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --quiet -e . pytest
      - run: python -m pytest -q -rs -m "not cross_repo"

  ft-stress:
    # The free-threading rows (pytest marker `ft`), which skip on a GIL build:
    # run them on both free-threaded interpreters, with the GIL left off.
    runs-on: ubuntu-latest
    strategy:
      # both free-threaded interpreters report, even when one fails
      fail-fast: false
      matrix:
        python-version: ["3.13t", "3.14t"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # free-threaded: newest NumPy/SciPy ship no cp313t wheel: prefer a wheel over an sdist build
      - run: python -m pip install --quiet --prefer-binary -e . pytest
      - name: The interpreter runs without the GIL
        run: |
          test -z "${PYTHON_GIL:-}" || { echo "PYTHON_GIL is set"; exit 1; }
          python -c "import sys; assert not sys._is_gil_enabled(), 'the GIL is on'"
      - name: Free-threading rows (never zero)
        run: |
          n=$(python -m pytest -m ft --collect-only -q | grep -c '::' || true)
          echo "ft rows collected: $n"
          test "$n" -gt 0
          python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m ft
      - run: python -m pytest -q -rs -p no:cacheprovider -W error::RuntimeWarning -m "not cross_repo"

  test-portability:
    # Portability: builds a wheel and
    # proves a fresh, index-free venv can install this checkout and run the
    # suite against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: |
          set -o pipefail
          python -m pip install --quiet pytest wheel
          rm -rf wh pg && mkdir -p wh
          python -m pip wheel --no-deps -w wh .
          python -m pip wheel -w wh pytest
          rm -rf ./*.egg-info
          python tools/portability_check.py --wheelhouse wh --scratch pg \
              --base-python "$(command -v python)" --tag ci \
              --log-out portability_raptor.pytest.log > portability_raptor.json
          python -c "import json,sys; v=json.load(open('portability_raptor.json'))['verdict']; print(v); sys.exit(0 if v.get('verdict')=='GREEN' else 1)"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portability-raptor
          retention-days: 7
          path: |
            portability_raptor.json
            portability_raptor.pytest.log
