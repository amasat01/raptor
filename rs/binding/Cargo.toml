[package]
name = "raptor_core_py"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
rcore = { path = "../core" }
pyo3 = { version = "0.28", features = ["extension-module"] }

[features]
# the stable ABI (one wheel for every CPython from 3.9); a free-threaded build has none: `maturin build --no-default-features`
default = ["abi3"]
abi3 = ["pyo3/abi3-py39"]
